name: Upload to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup App Store Connect Private Key & Keychain
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          cp BuildScripts/AuthKey_7B3D9LQ8HH.p8 ~/.appstoreconnect/private_keys/AuthKey_7B3D9LQ8HH.p8
          cp BuildScripts/AuthKey_7B3D9LQ8HH.p8 ~/.private_keys/AuthKey_7B3D9LQ8HH.p8

          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Convert P12 to legacy format supported by macOS security tool
          openssl pkcs12 -in BuildScripts/Draco_Distribution.p12 -passin pass:Draco2026! -nodes -out $RUNNER_TEMP/cert.pem
          openssl pkcs12 -export -in $RUNNER_TEMP/cert.pem -out $RUNNER_TEMP/legacy.p12 -passout pass:Draco2026! -legacy
          security import $RUNNER_TEMP/legacy.p12 -k $KEYCHAIN_PATH -P "Draco2026!" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          echo "Available Identities:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Prepare Assets & Re-sign IPA
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "" $KEYCHAIN_PATH

          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -o '".*"' | head -n 1 | tr -d '"')
          echo "Selected Signing Identity: $IDENTITY"

          echo "Extracting Build 6 IPA..."
          TMP_UNPACK=$RUNNER_TEMP/ipa_unpack
          mkdir -p $TMP_UNPACK
          unzip -q BuildScripts/DracoOnlineWorld.ipa -d $TMP_UNPACK

          APP_PATH=$(find $TMP_UNPACK/Payload -name "*.app" | head -n 1)
          echo "Target App Bundle: $APP_PATH"

          # Update Build Number to 12 for TestFlight update
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 12" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$APP_PATH/Info.plist"
          
          # Add Local Network Privacy permission for Wi-Fi test server
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Draco Online yerel test sunucusuna baglanmak icin yerel ag erisimi gereklidir.'" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'Draco Online yerel test sunucusuna baglanmak icin yerel ag erisimi gereklidir.'" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$APP_PATH/Info.plist"
          echo "Updated Info.plist to Build 12 with Local Network permissions."

          # 1. Generate all required Apple icons automatically from single AppIcon.png
          SRC_ICON="Assets/Textures/AppIcon.png"
          XC_DIR=$RUNNER_TEMP/AppIcon.xcassets/AppIcon.appiconset
          mkdir -p $XC_DIR

          sips -z 1024 1024 "$SRC_ICON" --out "$APP_PATH/AppIcon-1024.png"
          sips -z 1024 1024 "$SRC_ICON" --out "$XC_DIR/AppIcon-1024.png"
          sips -z 180 180 "$SRC_ICON" --out "$APP_PATH/AppIcon60x60@3x.png"
          sips -z 180 180 "$SRC_ICON" --out "$XC_DIR/AppIcon60x60@3x.png"
          sips -z 120 120 "$SRC_ICON" --out "$APP_PATH/AppIcon60x60@2x.png"
          sips -z 120 120 "$SRC_ICON" --out "$XC_DIR/AppIcon60x60@2x.png"
          sips -z 167 167 "$SRC_ICON" --out "$APP_PATH/AppIcon83.5x83.5@2x~ipad.png"
          sips -z 167 167 "$SRC_ICON" --out "$XC_DIR/AppIcon83.5x83.5@2x~ipad.png"
          sips -z 152 152 "$SRC_ICON" --out "$APP_PATH/AppIcon76x76@2x~ipad.png"
          sips -z 152 152 "$SRC_ICON" --out "$XC_DIR/AppIcon76x76@2x~ipad.png"
          sips -z 76 76 "$SRC_ICON" --out "$APP_PATH/AppIcon76x76~ipad.png"
          sips -z 76 76 "$SRC_ICON" --out "$XC_DIR/AppIcon76x76~ipad.png"

          cat << 'EOF' > $XC_DIR/Contents.json
          {
            "images" : [
              { "size" : "1024x1024", "idiom" : "ios-marketing", "filename" : "AppIcon-1024.png", "scale" : "1x" },
              { "size" : "60x60", "idiom" : "iphone", "filename" : "AppIcon60x60@2x.png", "scale" : "2x" },
              { "size" : "60x60", "idiom" : "iphone", "filename" : "AppIcon60x60@3x.png", "scale" : "3x" },
              { "size" : "76x76", "idiom" : "ipad", "filename" : "AppIcon76x76~ipad.png", "scale" : "1x" },
              { "size" : "76x76", "idiom" : "ipad", "filename" : "AppIcon76x76@2x~ipad.png", "scale" : "2x" },
              { "size" : "83.5x83.5", "idiom" : "ipad", "filename" : "AppIcon83.5x83.5@2x~ipad.png", "scale" : "2x" }
            ],
            "info" : {
              "version" : 1,
              "author" : "xcode"
            }
          }
          EOF

          xcrun actool $RUNNER_TEMP/AppIcon.xcassets --compile "$APP_PATH" --platform iphoneos --minimum-deployment-target 14.0 --app-icon AppIcon --output-partial-info-plist $RUNNER_TEMP/partial_info.plist

          # 2. Re-sign all Frameworks
          if [ -d "$APP_PATH/Frameworks" ]; then
            for f in "$APP_PATH"/Frameworks/*; do
              if [ -d "$f" ] || [ -f "$f" ]; then
                codesign --keychain $KEYCHAIN_PATH -f -s "$IDENTITY" --timestamp "$f" 2>/dev/null || true
              fi
            done
          fi

          # 3. Create Entitlements for TestFlight distribution
          cat << 'EOF' > $RUNNER_TEMP/Entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>XZYN89GYCH.com.dracoonlineworld.game</string>
              <key>get-task-allow</key>
              <false/>
              <key>beta-reports-active</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Re-sign App Bundle with Entitlements
          codesign --keychain $KEYCHAIN_PATH -f -s "$IDENTITY" --entitlements $RUNNER_TEMP/Entitlements.plist --timestamp "$APP_PATH"
          echo "Signature Verification:"
          codesign -dv --verbose=4 "$APP_PATH"

          # 4. Repackage IPA
          rm -f BuildScripts/DracoOnlineWorld.ipa
          (cd $TMP_UNPACK && zip -q -r "$GITHUB_WORKSPACE/BuildScripts/DracoOnlineWorld.ipa" .)
          echo "Clean Xcode 26 IPA ready for TestFlight upload!"

      - name: Upload IPA to TestFlight
        run: |
          echo "Starting TestFlight upload via xcrun altool..."
          xcrun altool --upload-app -f "BuildScripts/DracoOnlineWorld.ipa" -t ios --apiKey "7B3D9LQ8HH" --apiIssuer "354a8957-c515-4976-9a5d-9223d6eb6b60" --show-progress
