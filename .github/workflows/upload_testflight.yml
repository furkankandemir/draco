name: Upload to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup App Store Connect Private Key & Keychain
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          cp BuildScripts/AuthKey_7B3D9LQ8HH.p8 ~/.appstoreconnect/private_keys/AuthKey_7B3D9LQ8HH.p8
          cp BuildScripts/AuthKey_7B3D9LQ8HH.p8 ~/.private_keys/AuthKey_7B3D9LQ8HH.p8

          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Convert P12 to legacy format supported by macOS security tool
          openssl pkcs12 -in BuildScripts/Draco_Distribution.p12 -passin pass:Draco2026! -nodes -out $RUNNER_TEMP/cert.pem
          openssl pkcs12 -export -in $RUNNER_TEMP/cert.pem -out $RUNNER_TEMP/legacy.p12 -passout pass:Draco2026! -legacy
          security import $RUNNER_TEMP/legacy.p12 -k $KEYCHAIN_PATH -P "Draco2026!" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          echo "Available Identities:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Re-sign IPA with Apple Distribution Certificate
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "" $KEYCHAIN_PATH

          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -o '".*"' | head -n 1 | tr -d '"')
          echo "Selected Signing Identity: $IDENTITY"

          echo "Extracting IPA..."
          TMP_UNPACK=$RUNNER_TEMP/ipa_unpack
          mkdir -p $TMP_UNPACK
          unzip -q BuildScripts/DracoOnlineWorld.ipa -d $TMP_UNPACK

          APP_PATH=$(find $TMP_UNPACK/Payload -name "*.app" | head -n 1)
          echo "Signing App bundle: $APP_PATH"

          if [ -d "$APP_PATH/Frameworks" ]; then
            for f in "$APP_PATH"/Frameworks/*; do
              if [ -d "$f" ] || [ -f "$f" ]; then
                codesign --keychain $KEYCHAIN_PATH -f -s "$IDENTITY" --timestamp "$f" 2>/dev/null || true
              fi
            done
          fi

          codesign --keychain $KEYCHAIN_PATH -f -s "$IDENTITY" --timestamp "$APP_PATH"
          echo "Signature Verification:"
          codesign -dv --verbose=4 "$APP_PATH"

          rm -f BuildScripts/DracoOnlineWorld.ipa
          (cd $TMP_UNPACK && zip -q -r "$GITHUB_WORKSPACE/BuildScripts/DracoOnlineWorld.ipa" .)
          echo "Re-signed IPA successfully created!"

      - name: Upload IPA to TestFlight
        run: |
          echo "Starting TestFlight upload..."
          xcrun altool --upload-app -f "BuildScripts/DracoOnlineWorld.ipa" -t ios --apiKey "7B3D9LQ8HH" --apiIssuer "354a8957-c515-4976-9a5d-9223d6eb6b60" --show-progress
